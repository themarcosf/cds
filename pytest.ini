[pytest]
minversion = 9.0
testpaths = tests
python_files = *.py
pythonpath = src
cache_dir = .cache/pytest
truncation_limit_chars = 1000
addopts = 
    -ra 
    -vv
    -p no:cacheprovider
    --showlocals 
    --strict-markers 
    --durations=5
filterwarnings =
    ignore::pandas.errors.Pandas4Warning
    ignore:Solution may be inaccurate.*:UserWarning
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    flaky: marks tests that sometimes fail nondeterministically